<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/register.css">
    <title>Login/Sign up</title>
</head>

<body>
    <header>
        <nav aria-label="Main navigation">
            <ul class="nav justify-content-center">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item" id="add-item-link"><a class="nav-link" href="/itemInsert">Add item</a></li>
                <li class="nav-item" id="cart-link"><a class="nav-link" href="/basket">Basket</a></li>
                <li class="nav-item" id="profile-link"><a class="nav-link" href="/profile">Profile</a></li>
                <li class="nav-item" id="register-link">
                    <a class="nav-link active" href="/register" aria-current="page">Login/Register</a>
                </li>
                <li class="nav-item" id="logout-link">
                    <a class="nav-link" href="/" id="logout-button">Logout</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="account-page">
        <div class="account-switch-container" id="remember-switch-container">
            <span>Choose an option</span>
            <label class="remember-switch" for="remember-switch">
                <input type="checkbox" id="remember-switch" name="remember-switch" role="switch"
                    aria-label="Switch between signing in and signing up">
                <span class="remember-switch-track" aria-hidden="true"></span>
            </label>
        </div>
        <p id="account-status" role="status" aria-live="polite"></p>
        <form class="login-form" id="loginForm">

            <h1>Welcome back</h1>
            <p class="form-intro">Sign in to continue to your account.</p>
            <div class="form-floating mb-4">
                <input type="email" id="form1Example1" name="email" class="form-control" placeholder=" "
                    autocomplete="email" required />
                <label class="form-label" for="form1Example1">Email address</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" id="form1Example2" name="password" class="form-control" placeholder=" "
                    autocomplete="current-password" required />
                <label class="form-label" for="form1Example2">Password</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Log in</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
        <form class="register-form" id="registerForm" hidden>
            <h1>Create your account</h1>
            <p class="form-intro">Sign up to get started.</p>
            <div class="name-fields">
                <div class="form-floating">
                    <input type="text" id="form2Example1" name="fname" class="form-control" placeholder=" "
                        autocomplete="given-name" maxlength="100" required />
                    <label class="form-label" for="form2Example1">First name</label>
                </div>
                <div class="form-floating">
                    <input type="text" id="form2Example2" name="lname" class="form-control" placeholder=" "
                        autocomplete="family-name" maxlength="100" required />
                    <label class="form-label" for="form2Example2">Last name</label>
                </div>
            </div>

            <div class="form-floating mb-4">
                <input type="email" id="form2Example3" name="email" class="form-control" placeholder=" "
                    autocomplete="email" required />
                <label class="form-label" for="form2Example3">Email address</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" id="form2Example4" name="password" class="form-control" placeholder=" "
                    autocomplete="new-password" minlength="8" required />
                <label class="form-label" for="form2Example4">Password (at least 8 characters)</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
            <p id="message1" role="status" aria-live="polite"></p>

        </form>
    </main>
    <script src="/js/registerLogin.js" defer></script>
</body>

</html>
