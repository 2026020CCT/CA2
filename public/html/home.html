<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/index.css">
    <title>Shop home</title>
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <ul class="nav">
                <li class="nav-item"><a class="nav-link active" href="/" aria-current="page">Home</a></li>
                <li class="nav-item" id="add-item-link"><a class="nav-link" href="/itemInsert">Add item</a></li>
                <li class="nav-item" id="cart-link"><a class="nav-link" href="/basket">Basket</a></li>
                <li class="nav-item" id="profile-link"><a class="nav-link" href="/profile">Profile</a></li>
                <li class="nav-item" id="register-link"><a class="nav-link" href="/register">Login/Register</a></li>
                <li class="nav-item" id="logout-link"><a class="nav-link" href="/" id="logout-button">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="catalog-heading">
            <p class="eyebrow">THE SHOP</p>
            <h1>Find something you love</h1>
            <p>Browse the latest items in the shop.</p>
        </section>
        <section class="container" id="item-container" aria-label="Available items" aria-live="polite">
            <p class="catalog-message">Loading items…</p>
        </section>
    </main>
    <script src="/js/catalog.js" defer></script>
</body>
</html>
