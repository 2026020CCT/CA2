<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/itemInsert.css">
    <title>Add an item</title>
</head>

<body>
    <header>
        <ul class="nav justify-content-center">
            <li class="nav-item"><a class="nav-link" href="index">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="itemInsert">Add item</a></li>
            <li class="nav-item" id="cart-link"><a class="nav-link" href="/basket">Basket</a></li>
            <li class="nav-item" id="profile-link"><a class="nav-link" href="/profile">Profile</a></li>
            <li class="nav-item" id="register-link"><a class="nav-link" href="/register">Login/Register</a></li>
            <li class="nav-item" id="logout-link"><a class="nav-link" href="/" id="logout-button">Logout</a></li>
        </ul>
    </header>
    <main class="item-form-page">
        <form id="item-form" enctype="multipart/form-data">
            <h1>Add an item</h1>

            <label for="name">Item name</label>
            <input id="name" name="name" type="text" maxlength="100" required>

            <label for="picture">Item picture</label>
            <input id="picture" name="picture" type="file" accept="image/png,image/jpeg,image/webp" required>
            <small>Choose a PNG, JPEG, or WebP image (maximum 5 MB).</small>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" maxlength="1000" required></textarea>

            <label for="price">Price</label>
            <input id="price" name="price" type="number" min="0.01" step="0.01" required>

            <button type="submit">Save item</button>
            <p id="form-message" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="/js/itemInsert.js" defer></script>
</body>

</html>
